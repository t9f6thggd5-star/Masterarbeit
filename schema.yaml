# =============================================================================
# schema.yaml
#
# Single source of truth for all controlled vocabulary used throughout this
# repository (research/, wiki/) and the external sources folder (kept
# outside this Git repository — see CLAUDE.md section 1). CLAUDE.md refers
# to this file instead of repeating the lists. Do not invent new values outside this file
# without updating it here first — that is what keeps status/type values from
# drifting apart between R1, R2 and R3 over the course of the thesis.
# =============================================================================

scope_dimensions:
  connection:
    - COMMON
    - R1
    - R2
    - R3
  material:
    - COMMON
    - GL24h
    - GL75
  experiment_level:
    - COMMON
    - COMPONENT
    - FULL_CONNECTION

# -----------------------------------------------------------------------------
# Source types (external sources folder — original, unaltered documents,
# stored outside this Git repository)
# -----------------------------------------------------------------------------
source_type:
  NORMATIVE:
    description: "Standard / code / regulation (e.g. DIN, Eurocode)."
    authority: normative
  LITERATURE:
    description: "Scientific paper, journal article, book, conference paper."
    authority: peer_reviewed_or_secondary
  PRIMARY_DATA:
    description: "Original experimental data produced by this research."
    authority: project_specific
  PLAN:
    description: "Drawing, test plan, technical/geometry plan."
    authority: project_specific
  MANUFACTURER_DATA:
    description: "Technical datasheet or claim from a manufacturer."
    authority: commercial_claim
  REPORT:
    description: "Expert report / Gutachten."
    authority: expert_opinion
  PROJECT_BRIEF:
    description: >
      Project-internal directive / organisational document that defines
      scope or tasks rather than making a technical claim — e.g. the
      thesis task assignment (Aufgabenstellung), a project scope memo.
      Not a technical/geometry plan (PLAN), not an expert opinion (REPORT).
    authority: project_specific

# -----------------------------------------------------------------------------
# Research types (research/ + wiki/ — derived, non-source content)
# -----------------------------------------------------------------------------
research_type:
  CALCULATION:
    description: "Own analytical or numerical calculation."
  PROCESSED_DATA:
    description: "Data derived from raw measurements (filtered, corrected, aggregated)."
  EXPERIMENTAL_RESULT:
    description: "Characteristic result derived from experimental/processed data."
  RAW_MEASUREMENT:
    description: "Directly recorded measurement value, unmodified."
  OBSERVATION:
    description: "Something directly observed during an experiment."
  ASSUMPTION:
    description: "A provisional assumption introduced by the researcher."
  HYPOTHESIS:
    description: "A statement currently being investigated."
  INTERPRETATION:
    description: "An explanation of an observation or result."
  CONCLUSION:
    description: "A higher-level conclusion based on evidence."
  DECISION:
    description: "A methodological or research decision."

# -----------------------------------------------------------------------------
# Certainty (ONE field, used on every entry that makes a claim about
# reality — research/ entries and wiki/ claims alike — for "how
# well-grounded is this".
#
# This single list replaces five previously separate, overlapping fields
# (status, certainty_level, confidence, claim_status, hypothesis_status)
# that all expressed some variant of the same question in slightly
# different words depending on entry type. One field, one place to look,
# regardless of whether the entry is a RAW_MEASUREMENT, a CONCLUSION or a
# wiki CLAIM.
#
# Deliberate exception: templates/open_question.md keeps its own
# `status: OPEN | RESOLVED` (schema.yaml -> open_question_status) instead
# of using `certainty` — a question is not a claim about reality, so
# "how certain is it" does not apply; it has a resolution state instead,
# which is a different kind of thing. Folding it into `certainty` would
# recreate exactly the kind of mixed-purpose field this change removes.
# templates/decision.md needs no certainty field at all, for the same
# reason (a decision is an action, not a claim).
# -----------------------------------------------------------------------------
certainty:
  - ESTABLISHED     # normatively fixed, or overwhelming consensus (was: claim_status NORMATIVE)
  - MEASURED        # directly measured / empirically recorded or derived from measurement
  - CALCULATED      # result of an own analytical/numerical calculation
  - SOURCE_CLAIM    # reported by a source, not independently verified
  - ASSUMED         # explicit working assumption, not yet confirmed
  - HYPOTHESIZED    # under investigation, not yet supported or refuted
  - CONFIRMED       # a hypothesis supported by subsequent evidence
  - REJECTED        # a hypothesis refuted by subsequent evidence
  - INTERPRETED     # researcher's interpretation, not a raw fact
  - SYNTHESIS       # researcher's own synthesis across multiple sources/results
  - UNKNOWN         # certainty cannot currently be classified — do not guess
  - PROVENANCE_UNKNOWN # distinct from UNKNOWN: specifically that origin/lineage
                        # (which source, which measurement, which method) could
                        # not be established — never invent it (CLAUDE.md section 17)

# -----------------------------------------------------------------------------
# Open question status (templates/open_question.md -> status)
#
# Kept separate from `certainty` above — see the note there for why.
# -----------------------------------------------------------------------------
open_question_status:
  - OPEN
  - RESOLVED

# -----------------------------------------------------------------------------
# Authorship / review status (see CLAUDE.md section on Authorship and
# Review Status — applies to interpretations, conclusions and hypotheses)
# -----------------------------------------------------------------------------
authored_by:
  - RESEARCHER      # entered/written by the researcher directly
  - CLAUDE_DRAFT    # proposed by Claude, not yet reviewed/confirmed

# reviewed: true | false
#   Only meaningful for authored_by: CLAUDE_DRAFT. Always false on creation.
#   Set to true only by the researcher's own action, never by Claude itself.

# -----------------------------------------------------------------------------
# Unit convention (see CLAUDE.md section on Units)
#
# Define ONE fixed unit per physical quantity here, once, before entering
# real data — then apply it everywhere. Do not decide the unit per entry;
# that is exactly what causes silent mismatches between sources, own
# measurements and calculations.
# -----------------------------------------------------------------------------
unit_convention:
  force:
  length:
  stress:
  moment:
  angle:
  # extend with further quantities as needed, once for the whole thesis

# -----------------------------------------------------------------------------
# ID naming convention (mandatory — see CLAUDE.md section 14)
#
# There are TWO separate ID namespaces. Do not mix them.
#
# 1) INTERNAL / PROJECT-GENERATED entries — everything created by this
#    research itself: experiments, raw measurements, processed data,
#    experimental results, calculations, assumptions, hypotheses,
#    interpretations, conclusions, decisions, open questions — and wiki
#    claims (templates/claim.md), which are likewise project-specific
#    statements scoped to a connection/material, not external sources.
#    These always have a connection/material scope, so they follow the
#    strict pattern below.
#
#    Pattern: <CONNECTION>-<MATERIAL>-<CATEGORY>-<NUMBER>
#    CONNECTION: R1 | R2 | R3 | COMMON
#    MATERIAL:   GL24h | GL75 | COMMON
#    CATEGORY:   FULL | CMP (component) | RAW | PROC | RES | CALC | ASS | HYP |
#                INT | CON (conclusion) | DEC (decision) | OPQ (open question) |
#                CLAIM (wiki claim, templates/claim.md)
#    NUMBER:     zero-padded 3-digit running number, unique within its
#                category and scope — never reused, never renumbered.
#
#    Note on RAW/PROC/RES specifically: templates/raw_measurement.md,
#    processed_data.md and experimental_result.md document their ID as
#    "<CONNECTION>-<MATERIAL>-<EXPERIMENT-ID>-RAW/PROC/RES-<NUMBER>",
#    i.e. nesting the parent experiment's own ID inside the pattern above
#    rather than following the flat 4-token pattern directly. This is a
#    deliberate exception (a measurement belongs to one specific
#    experiment run, not just to a connection/material), but it means
#    scripts/lint.py can only check the CONNECTION-MATERIAL- prefix and
#    the category token for these three types, not the full flat pattern.
#
# 2) EXTERNAL SOURCES — norms, papers, books, manufacturer data, reports.
#    These are NOT project-generated and do NOT get a connection/material
#    code of their own (a norm is not "R1's norm"). They are identified by
#    the free-form `id` used in bibliography/sources.yaml — the concrete
#    naming convention for this namespace (e.g. author+year, or a norm's
#    own designation) is defined there, once real sources are entered.
#
#    A calculation's or claim's `normative_sources` / `literature` /
#    `source` field always references an id from namespace (2), never
#    namespace (1) — see templates/calculation.md and templates/claim.md.
# -----------------------------------------------------------------------------
id_pattern: "<CONNECTION>-<MATERIAL>-<CATEGORY>-<NUMBER>"   # namespace (1) only
